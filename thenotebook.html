<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Notebook — ildes.me</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FFEFE2;
    --ink: #16130F;
    --muted: #9A8F80;
    --tab-outline: #E7D3BD;
    --tab-fill: #BEE7F7;
    --shadow: #16130F;
  }
  *{ box-sizing: border-box; }
  html, body{
    margin:0; padding:0;
    min-height:100%;
    background: var(--bg);
    color: var(--ink);
  }
  body{
    font-family: 'Inter', -apple-system, sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 6vh 20px 60px;
    position: relative;
  }

  #bg-spiders{
    position: fixed;
    top:0; left:0;
    width:100%; height:100%;
    pointer-events:none;
    z-index: 0;
  }

  .home-link{
    position: fixed;
    top: 20px; left: 22px;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    color: var(--muted);
    text-decoration: none;
    z-index: 2;
  }
  .home-link:hover{ color: var(--ink); }

  h1{
    font-family: 'Fredoka', sans-serif;
    font-weight: 700;
    font-size: clamp(28px, 6vw, 46px);
    letter-spacing: -0.02em;
    margin: 0 0 34px;
    text-align: center;
    position: relative;
    z-index: 1;
  }

  .page-content{
    width: min(520px, 92vw);
    position: relative;
    z-index: 1;
  }

  .movie-title{
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: clamp(22px, 4vw, 30px);
    text-align: left;
    margin: 0 0 16px;
  }

  .verdict-box{
    width: 100%;
    min-height: 220px;
    border-radius: 18px;
    border: 3px solid var(--tab-outline);
    background: var(--tab-fill);
    box-shadow: 8px 8px 0 var(--shadow);
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 40px 32px;
    text-align:center;
  }

  .verdict-box p{
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: clamp(17px, 2.6vw, 22px);
    line-height: 1.4;
    margin: 0;
  }
</style>
</head>
<body>

  <canvas id="bg-spiders"></canvas>
  <a class="home-link" href="aretherespiders.html">&larr; Are there spiders?</a>

  <h1 class="exclude-spiders">Are there spiders?</h1>

  <div class="page-content exclude-spiders">
    <div class="movie-title">The Notebook</div>
    <div class="verdict-box">
      <p>No, there are no spiders in this movie.</p>
    </div>
  </div>

<script>
(function(){
  // Ambient, non-interactive spiders scattered across the whole page.
  const canvas = document.getElementById('bg-spiders');
  const ctx = canvas.getContext('2d');

  function drawSpider(ctx, cx, cy, s, rot){
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rot);
    ctx.scale(s, s);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = '#1c1a17';
    ctx.fillStyle = '#1c1a17';
    ctx.lineWidth = 0.09;

    const legBends = [-0.9, -0.45, 0.45, 0.9];
    legBends.forEach((la) => {
      const midY = Math.sin(la) * 0.5;
      const endY = Math.sin(la) * 0.95;
      ctx.beginPath();
      ctx.moveTo(0.14, 0);
      ctx.quadraticCurveTo(0.6, midY * 0.6, 1.0, endY);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(-0.14, 0);
      ctx.quadraticCurveTo(-0.6, midY * 0.6, -1.0, endY);
      ctx.stroke();
    });

    ctx.beginPath();
    ctx.ellipse(0.08, 0, 0.42, 0.36, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    ctx.ellipse(-0.38, 0, 0.22, 0.2, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#e6402f';
    ctx.beginPath(); ctx.ellipse(-0.45, -0.08, 0.05, 0.05, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(-0.45, 0.08, 0.05, 0.05, 0, 0, Math.PI * 2); ctx.fill();

    ctx.restore();
  }

  function rand(a, b){ return a + Math.random() * (b - a); }

  function getExclusionRects(){
    const margin = 22;
    const rects = [];
    document.querySelectorAll('.exclude-spiders').forEach((el) => {
      const r = el.getBoundingClientRect();
      rects.push({
        left: r.left - margin, right: r.right + margin,
        top: r.top - margin, bottom: r.bottom + margin
      });
    });
    return rects;
  }

  function isInsideAny(x, y, rects){
    for(const r of rects){
      if(x > r.left && x < r.right && y > r.top && y < r.bottom) return true;
    }
    return false;
  }

  let W, H, dpr;
  let spiders = [];

  function layout(){
    dpr = window.devicePixelRatio || 1;
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const rects = getExclusionRects();
    const count = Math.max(26, Math.round((W * H) / 30000));
    spiders = [];
    for(let i = 0; i < count; i++){
      let x, y, tries = 0;
      do{
        x = rand(0.03, 0.97) * W;
        y = rand(0.03, 0.97) * H;
        tries++;
      } while(isInsideAny(x, y, rects) && tries < 30);

      spiders.push({
        x, y,
        rot: rand(0, Math.PI * 2),
        scale: rand(0.5, 1.0) * (W * 0.017),
        phase: rand(0, Math.PI * 2),
        speed: rand(0.6, 1.3),
        ampPos: rand(1, 2.5),
        ampRot: rand(0.03, 0.08)
      });
    }
  }
  layout();
  window.addEventListener('resize', layout);

  function frame(now){
    const t = now / 1000;
    ctx.clearRect(0, 0, W, H);
    for(const sp of spiders){
      const dx = Math.sin(t * sp.speed + sp.phase) * sp.ampPos;
      const dy = Math.cos(t * sp.speed * 0.8 + sp.phase) * sp.ampPos;
      const dr = Math.sin(t * sp.speed * 1.3 + sp.phase) * sp.ampRot;
      drawSpider(ctx, sp.x + dx, sp.y + dy, sp.scale, sp.rot + dr);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
