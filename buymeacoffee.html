<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buy Me a Coffee</title>
<style>
  html, body{
    margin:0; padding:0;
    width:100%; height:100%;
    background:#B7A968;
    overflow:hidden;
  }

  #bg-pattern{
    position: fixed;
    top:0; left:0;
    width:100%; height:100%;
    pointer-events:none;
    z-index: 0;
  }

  .bmc-btn{
    position: fixed;
    top: 0;
    left: 0;
    transform: translate(-50%, -50%);
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 20px;
    border-radius: 999px;
    background: #FFDD00;
    color: #000000;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-weight: 700;
    font-size: 15px;
    text-decoration: none;
    white-space: nowrap;
    user-select: none;
    box-shadow: 0 6px 18px rgba(0,0,0,0.22);
    z-index: 999999;
    pointer-events: auto;
  }
  .bmc-btn .icon{
    font-size: 17px;
    line-height: 1;
  }
</style>
</head>
<body>

  <canvas id="bg-pattern"></canvas>

  <a id="bmc" class="bmc-btn" href="https://buymeacoffee.com/gicik" target="_blank" rel="noopener noreferrer">
    <span class="icon">☕</span>
    <span>Buy me a coffee</span>
  </a>

<script>
(function(){
  // Evenly spaced, non-interactive coffee cup pattern across the whole page.
  const canvas = document.getElementById('bg-pattern');
  const ctx = canvas.getContext('2d');
  const ICON_COLOR = 'rgba(74, 58, 20, 0.16)';
  const SPACING = 110;
  const ICON_SIZE = 17;

  function drawCoffeeIcon(cx, cy, s){
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(s, s);
    ctx.fillStyle = ICON_COLOR;
    ctx.strokeStyle = ICON_COLOR;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    // cup body
    ctx.beginPath();
    ctx.moveTo(-0.5, -0.3);
    ctx.lineTo(0.5, -0.3);
    ctx.lineTo(0.4, 0.5);
    ctx.lineTo(-0.4, 0.5);
    ctx.closePath();
    ctx.fill();

    // handle
    ctx.lineWidth = 0.11;
    ctx.beginPath();
    ctx.arc(0.58, -0.02, 0.22, -Math.PI * 0.5, Math.PI * 0.5);
    ctx.stroke();

    // steam
    ctx.lineWidth = 0.08;
    ctx.beginPath();
    ctx.moveTo(-0.15, -0.42);
    ctx.quadraticCurveTo(-0.28, -0.62, -0.1, -0.8);
    ctx.moveTo(0.15, -0.42);
    ctx.quadraticCurveTo(0.02, -0.62, 0.2, -0.8);
    ctx.stroke();

    ctx.restore();
  }

  function draw(){
    const dpr = window.devicePixelRatio || 1;
    const W = window.innerWidth, H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);

    for(let y = SPACING / 2; y < H + SPACING; y += SPACING){
      for(let x = SPACING / 2; x < W + SPACING; x += SPACING){
        drawCoffeeIcon(x, y, ICON_SIZE);
      }
    }
  }

  draw();
  window.addEventListener('resize', draw);
})();

(function(){
  const btn = document.getElementById('bmc');

  function place(x, y){
    // Direct style writes on every event, no transition/easing/rAF delay —
    // the button is repositioned before the browser paints the next frame,
    // so it never trails the cursor and a click always lands on it.
    btn.style.left = x + 'px';
    btn.style.top = y + 'px';
  }

  // start centered so it's visible before any movement happens
  place(window.innerWidth / 2, window.innerHeight / 2);

  window.addEventListener('mousemove', (e) => {
    place(e.clientX, e.clientY);
  });

  window.addEventListener('touchmove', (e) => {
    if(e.touches && e.touches[0]){
      place(e.touches[0].clientX, e.touches[0].clientY);
    }
  }, { passive: true });

  window.addEventListener('resize', () => {
    // keep it on-screen if the viewport changes and nothing has moved yet
  });
})();
</script>
</body>
</html>
