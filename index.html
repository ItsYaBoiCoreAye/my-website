<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ildes.me</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FCF9F2;
    --ink: #16130F;
    --card-bg: #FFFFFF;
    --accent: #FF5B39;
    --shadow: #16130F;
    --muted: #8A8478;
  }
  *{ box-sizing: border-box; }
  html, body{
    margin:0; padding:0;
    width:100%; height:100%;
    background: var(--bg);
    color: var(--ink);
  }
  body{
    font-family: 'Inter', -apple-system, sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100vh;
    padding: 8vh 20px 40px;
  }

  .wordmark{
    font-family: 'Fredoka', sans-serif;
    font-weight: 700;
    font-size: clamp(28px, 5vw, 44px);
    letter-spacing: -0.02em;
    color: var(--ink);
    margin: 0 0 auto;
  }

  .stage{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
  }

  .card-link{
    text-decoration:none;
    color:inherit;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:16px;
  }

  .card{
    width: min(360px, 78vw);
    aspect-ratio: 4 / 3;
    border-radius: 22px;
    border: 3px solid var(--ink);
    background: var(--card-bg);
    box-shadow: 8px 8px 0 var(--shadow);
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.18s cubic-bezier(.2,.9,.3,1.3), box-shadow 0.18s ease;
    display:flex;
  }
  .card canvas{
    width:100%;
    height:100%;
    display:block;
  }

  .card-link:hover .card{
    transform: translate(-4px, -6px) scale(1.045);
    box-shadow: 14px 14px 0 var(--shadow);
  }
  .card-link:active .card{
    transform: translate(-1px, -1px) scale(1.01);
    box-shadow: 4px 4px 0 var(--shadow);
  }

  .caption{
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 19px;
    text-align:center;
  }
  .caption .sub{
    display:block;
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    font-size: 13px;
    color: var(--muted);
    margin-top: 4px;
    letter-spacing: 0.01em;
  }

  .card-link:focus-visible .card{
    outline: 3px solid var(--accent);
    outline-offset: 4px;
  }
</style>
</head>
<body>

  <div class="wordmark">ildes.me</div>

  <div class="stage">
    <a class="card-link" href="donttouchmyknives">
      <div class="card">
        <canvas id="thumb"></canvas>
      </div>
      <div class="caption">
        Don't Touch My Knives
        <span class="sub">a small, defensive experiment</span>
      </div>
    </a>
  </div>

<script>
(function(){
  // Static mini recreation of the knife-game's art style, drawn once.
  const canvas = document.getElementById('thumb');
  const ctx = canvas.getContext('2d');

  function buildKnifeSprite(){
    const w = 22, h = 9;
    const off = document.createElement('canvas');
    off.width = w; off.height = h;
    const c = off.getContext('2d');
    c.imageSmoothingEnabled = false;
    c.fillStyle = '#6b3e1e'; c.fillRect(0, 2, 7, 5);
    c.fillStyle = '#4a2a12'; c.fillRect(0, 6, 7, 1);
    c.fillStyle = '#8a5a2e'; c.fillRect(0, 2, 7, 1);
    c.fillStyle = '#2b2b2b'; c.fillRect(7, 1, 2, 7);
    const bx0 = 9, bx1 = 21, cy = 4, maxHalf = 3;
    for(let x = bx0; x <= bx1; x++){
      const t = (x - bx0) / (bx1 - bx0);
      const half = Math.round(maxHalf * (1 - t));
      for(let y = cy - half; y <= cy + half; y++){
        if(y < cy) c.fillStyle = '#eef0ef';
        else if(y > cy) c.fillStyle = '#9a9d9c';
        else c.fillStyle = '#d4d7d6';
        c.fillRect(x, y, 1, 1);
      }
    }
    return { img: off, w, h };
  }
  const sprite = buildKnifeSprite();

  function draw(){
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const W = rect.width, H = rect.height;

    // background
    ctx.fillStyle = '#171614';
    ctx.fillRect(0, 0, W, H);

    // headline
    let size = Math.floor(W * 0.11);
    ctx.font = `bold ${size}px 'Courier New', monospace`;
    while(ctx.measureText("DON'T TOUCH").width > W * 0.8 && size > 8){
      size -= 1;
      ctx.font = `bold ${size}px 'Courier New', monospace`;
    }
    ctx.fillStyle = '#c7c3bc';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText("DON'T TOUCH", W / 2, H / 2 - size * 0.65);
    ctx.fillText("MY KNIVES", W / 2, H / 2 + size * 0.65);

    // scatter a handful of knives around the edges
    ctx.imageSmoothingEnabled = false;
    const seedPositions = [
      [0.14, 0.18, -0.4], [0.85, 0.15, 2.1], [0.10, 0.82, 0.9],
      [0.88, 0.80, -1.6], [0.5, 0.10, 1.2], [0.06, 0.5, 2.6],
      [0.94, 0.5, -0.5], [0.5, 0.9, -2.3]
    ];
    const drawW = W * 0.16;
    const drawH = drawW * (sprite.h / sprite.w);
    seedPositions.forEach(([px, py, angle]) => {
      ctx.save();
      ctx.translate(px * W, py * H);
      ctx.rotate(angle);
      ctx.drawImage(sprite.img, 0, 0, sprite.w, sprite.h, -drawW / 2, -drawH / 2, drawW, drawH);
      ctx.restore();
    });
  }

  draw();
  window.addEventListener('resize', draw);
})();
</script>
</body>
</html>
