<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ildes.me</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FCF9F2;
    --ink: #16130F;
    --card-bg: #FFFFFF;
    --accent: #FF5B39;
    --shadow: #16130F;
    --muted: #8A8478;
  }
  *{ box-sizing: border-box; }
  html, body{
    margin:0; padding:0;
    width:100%; height:100%;
    background: var(--bg);
    color: var(--ink);
  }
  body{
    font-family: 'Inter', -apple-system, sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100vh;
    padding: 8vh 20px 40px;
  }

  .wordmark{
    font-family: 'Fredoka', sans-serif;
    font-weight: 700;
    font-size: clamp(28px, 5vw, 44px);
    letter-spacing: -0.02em;
    color: var(--ink);
    margin: 0 0 auto;
  }

  .stage{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:48px;
    width:100%;
    padding: 32px 0;
  }

  .card-link{
    text-decoration:none;
    color:inherit;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:16px;
  }

  .card{
    width: min(360px, 78vw);
    aspect-ratio: 4 / 3;
    border-radius: 22px;
    border: 3px solid var(--ink);
    background: var(--card-bg);
    box-shadow: 8px 8px 0 var(--shadow);
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.18s cubic-bezier(.2,.9,.3,1.3), box-shadow 0.18s ease;
    display:flex;
  }
  .card canvas{
    width:100%;
    height:100%;
    display:block;
  }

  .card-link:hover .card{
    transform: translate(-4px, -6px) scale(1.045);
    box-shadow: 14px 14px 0 var(--shadow);
  }
  .card-link:active .card{
    transform: translate(-1px, -1px) scale(1.01);
    box-shadow: 4px 4px 0 var(--shadow);
  }

  .caption{
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 19px;
    text-align:center;
  }
  .caption .sub{
    display:block;
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    font-size: 13px;
    color: var(--muted);
    margin-top: 4px;
    letter-spacing: 0.01em;
  }

  .card-link:focus-visible .card{
    outline: 3px solid var(--accent);
    outline-offset: 4px;
  }
</style>
</head>
<body>

  <div class="wordmark">ildes.me</div>

  <div class="stage">
    <a class="card-link" href="donttouchmyknives">
      <div class="card">
        <canvas id="thumb"></canvas>
      </div>
      <div class="caption">
        Don't Touch My Knives
        <span class="sub">really... don't do it</span>
      </div>
    </a>

    <a class="card-link" href="aretherespiders">
      <div class="card">
        <canvas id="thumb-spiders"></canvas>
      </div>
      <div class="caption">
        Are There Spiders?
        <span class="sub">spoiler: it depends</span>
      </div>
    </a>

    <a class="card-link" href="trillionaire.html">
      <div class="card">
        <canvas id="thumb-rich"></canvas>
      </div>
      <div class="caption">
        How Rich?
        <span class="sub">spoiler: too rich</span>
      </div>
    </a>

    <a class="card-link" href="buymeacoffee">
      <div class="card">
        <canvas id="thumb-bmc"></canvas>
      </div>
      <div class="caption">
        Buy Me A Coffee
        <span class="sub">please, I'm broke</span>
      </div>
    </a>
  </div>

<script>
(function(){
  // Static mini recreation of the knife-game's art style, drawn once.
  const canvas = document.getElementById('thumb');
  const ctx = canvas.getContext('2d');

  function buildKnifeSprite(){
    const w = 22, h = 9;
    const off = document.createElement('canvas');
    off.width = w; off.height = h;
    const c = off.getContext('2d');
    c.imageSmoothingEnabled = false;
    c.fillStyle = '#6b3e1e'; c.fillRect(0, 2, 7, 5);
    c.fillStyle = '#4a2a12'; c.fillRect(0, 6, 7, 1);
    c.fillStyle = '#8a5a2e'; c.fillRect(0, 2, 7, 1);
    c.fillStyle = '#2b2b2b'; c.fillRect(7, 1, 2, 7);
    const bx0 = 9, bx1 = 21, cy = 4, maxHalf = 3;
    for(let x = bx0; x <= bx1; x++){
      const t = (x - bx0) / (bx1 - bx0);
      const half = Math.round(maxHalf * (1 - t));
      for(let y = cy - half; y <= cy + half; y++){
        if(y < cy) c.fillStyle = '#eef0ef';
        else if(y > cy) c.fillStyle = '#9a9d9c';
        else c.fillStyle = '#d4d7d6';
        c.fillRect(x, y, 1, 1);
      }
    }
    return { img: off, w, h };
  }
  const sprite = buildKnifeSprite();

  function draw(){
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const W = rect.width, H = rect.height;

    // background
    ctx.fillStyle = '#171614';
    ctx.fillRect(0, 0, W, H);

    // headline
    let size = Math.floor(W * 0.11);
    ctx.font = `bold ${size}px 'Courier New', monospace`;
    while(ctx.measureText("DON'T TOUCH").width > W * 0.8 && size > 8){
      size -= 1;
      ctx.font = `bold ${size}px 'Courier New', monospace`;
    }
    ctx.fillStyle = '#c7c3bc';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText("DON'T TOUCH", W / 2, H / 2 - size * 0.65);
    ctx.fillText("MY KNIVES", W / 2, H / 2 + size * 0.65);

    // scatter a handful of knives around the edges
    ctx.imageSmoothingEnabled = false;
    const seedPositions = [
      [0.14, 0.18, -0.4], [0.85, 0.15, 2.1], [0.10, 0.82, 0.9],
      [0.88, 0.80, -1.6], [0.5, 0.10, 1.2], [0.06, 0.5, 2.6],
      [0.94, 0.5, -0.5], [0.5, 0.9, -2.3]
    ];
    const drawW = W * 0.16;
    const drawH = drawW * (sprite.h / sprite.w);
    seedPositions.forEach(([px, py, angle]) => {
      ctx.save();
      ctx.translate(px * W, py * H);
      ctx.rotate(angle);
      ctx.drawImage(sprite.img, 0, 0, sprite.w, sprite.h, -drawW / 2, -drawH / 2, drawW, drawH);
      ctx.restore();
    });
  }

  draw();
  window.addEventListener('resize', draw);
})();

(function(){
  // Static mini scene for the spiders card: simple, rounded, non-scary spiders.
  const canvas = document.getElementById('thumb-spiders');
  const ctx = canvas.getContext('2d');

  function drawSpider(ctx, cx, cy, s, rot){
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rot);
    ctx.scale(s, s);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = '#1c1a17';
    ctx.fillStyle = '#1c1a17';
    ctx.lineWidth = 0.09;

    // 4 curved legs per side
    const legBends = [-0.9, -0.45, 0.45, 0.9];
    legBends.forEach((la) => {
      const midY = Math.sin(la) * 0.5;
      const endY = Math.sin(la) * 0.95;
      ctx.beginPath();
      ctx.moveTo(0.14, 0);
      ctx.quadraticCurveTo(0.6, midY * 0.6, 1.0, endY);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(-0.14, 0);
      ctx.quadraticCurveTo(-0.6, midY * 0.6, -1.0, endY);
      ctx.stroke();
    });

    // rounded abdomen
    ctx.beginPath();
    ctx.ellipse(0.08, 0, 0.42, 0.36, 0, 0, Math.PI * 2);
    ctx.fill();

    // small round head
    ctx.beginPath();
    ctx.ellipse(-0.38, 0, 0.22, 0.2, 0, 0, Math.PI * 2);
    ctx.fill();

    // two friendly red dot eyes
    ctx.fillStyle = '#e6402f';
    ctx.beginPath(); ctx.ellipse(-0.45, -0.08, 0.05, 0.05, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(-0.45, 0.08, 0.05, 0.05, 0, 0, Math.PI * 2); ctx.fill();

    ctx.restore();
  }

  function draw(){
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const W = rect.width, H = rect.height;

    // background
    ctx.fillStyle = '#FFEFE2';
    ctx.fillRect(0, 0, W, H);

    // 6 spiders scattered around the edges, center left clear for the text
    const seedPositions = [
      [0.15, 0.20, -0.3, 0.95], [0.85, 0.18, 2.6, 1.05],
      [0.10, 0.78, 1.0, 0.9], [0.88, 0.80, -2.0, 1.0],
      [0.50, 0.90, 0.5, 0.85], [0.50, 0.10, -2.4, 0.85]
    ];
    const baseR = W * 0.095;
    seedPositions.forEach(([px, py, angle, scale]) => {
      drawSpider(ctx, px * W, py * H, baseR * scale, angle);
    });

    // headline
    let size = Math.floor(W * 0.12);
    ctx.font = `600 ${size}px 'Fredoka', sans-serif`;
    while(ctx.measureText("Are there").width > W * 0.62 && size > 8){
      size -= 1;
      ctx.font = `600 ${size}px 'Fredoka', sans-serif`;
    }
    ctx.fillStyle = '#16130F';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText("Are there", W / 2, H / 2 - size * 0.6);
    ctx.fillText("spiders?", W / 2, H / 2 + size * 0.6);
  }

  draw();
  window.addEventListener('resize', draw);
  if(document.fonts && document.fonts.ready){
    document.fonts.ready.then(draw);
  }
})();

(function(){
  // Static mini recreation of the trillionaire.html page's style: its cream
  // background, scattered dollar signs, and bold headline.
  const canvas = document.getElementById('thumb-rich');
  const ctx = canvas.getContext('2d');

  function draw(){
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const W = rect.width, H = rect.height;

    // background — same cream as trillionaire.html
    ctx.fillStyle = '#FCF9F2';
    ctx.fillRect(0, 0, W, H);

    // scatter muted dollar signs around the edges, center clear for the text
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const seedPositions = [
      [0.14, 0.16, -0.25, 1.0], [0.86, 0.14, 0.3, 1.15],
      [0.09, 0.5, 0.15, 0.85],  [0.91, 0.5, -0.2, 0.9],
      [0.13, 0.85, 0.2, 1.0],   [0.87, 0.86, -0.3, 1.1],
      [0.5, 0.92, 0.1, 0.8]
    ];
    const baseSize = W * 0.16;
    seedPositions.forEach(([px, py, rot, scale]) => {
      ctx.save();
      ctx.translate(px * W, py * H);
      ctx.rotate(rot);
      ctx.font = `700 ${Math.round(baseSize * scale)}px 'Roboto Mono', monospace`;
      ctx.fillStyle = 'rgba(22, 19, 15, 0.14)';
      ctx.fillText('$', 0, 0);
      ctx.restore();
    });

    // one yellow accent dollar sign, top right, like the crown marker
    ctx.save();
    ctx.translate(W * 0.82, H * 0.28);
    ctx.rotate(-0.15);
    ctx.font = `700 ${Math.round(baseSize * 1.3)}px 'Roboto Mono', monospace`;
    ctx.fillStyle = '#FFDD00';
    ctx.strokeStyle = '#16130F';
    ctx.lineWidth = 2;
    ctx.strokeText('$', 0, 0);
    ctx.fillText('$', 0, 0);
    ctx.restore();

    // headline
    let size = Math.floor(W * 0.13);
    ctx.font = `700 ${size}px 'Fredoka', sans-serif`;
    while(ctx.measureText("HOW RICH").width > W * 0.72 && size > 8){
      size -= 1;
      ctx.font = `700 ${size}px 'Fredoka', sans-serif`;
    }
    ctx.fillStyle = '#16130F';
    ctx.fillText('HOW RICH', W / 2, H / 2 - size * 0.62);
    ctx.fillText('IS ELON?', W / 2, H / 2 + size * 0.62);
  }

  draw();
  window.addEventListener('resize', draw);
  if(document.fonts && document.fonts.ready){
    document.fonts.ready.then(draw);
  }
})();

(function(){
  // Static mini recreation of the buymeacoffee.html page: the muted yellow
  // background, its scattered coffee-cup pattern, and the pill button.
  const canvas = document.getElementById('thumb-bmc');
  const ctx = canvas.getContext('2d');

  function drawCoffeeIcon(cx, cy, s, color){
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(s, s);
    ctx.fillStyle = color;
    ctx.strokeStyle = color;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    ctx.beginPath();
    ctx.moveTo(-0.5, -0.3);
    ctx.lineTo(0.5, -0.3);
    ctx.lineTo(0.4, 0.5);
    ctx.lineTo(-0.4, 0.5);
    ctx.closePath();
    ctx.fill();

    ctx.lineWidth = 0.11;
    ctx.beginPath();
    ctx.arc(0.58, -0.02, 0.22, -Math.PI * 0.5, Math.PI * 0.5);
    ctx.stroke();

    ctx.lineWidth = 0.08;
    ctx.beginPath();
    ctx.moveTo(-0.15, -0.42);
    ctx.quadraticCurveTo(-0.28, -0.62, -0.1, -0.8);
    ctx.moveTo(0.15, -0.42);
    ctx.quadraticCurveTo(0.02, -0.62, 0.2, -0.8);
    ctx.stroke();

    ctx.restore();
  }

  function drawPillButton(cx, cy, w, h){
    const r = h / 2;
    ctx.save();
    ctx.fillStyle = '#FFDD00';
    ctx.beginPath();
    ctx.moveTo(cx - w / 2 + r, cy - h / 2);
    ctx.arcTo(cx + w / 2, cy - h / 2, cx + w / 2, cy + h / 2, r);
    ctx.arcTo(cx + w / 2, cy + h / 2, cx - w / 2, cy + h / 2, r);
    ctx.arcTo(cx - w / 2, cy + h / 2, cx - w / 2, cy - h / 2, r);
    ctx.arcTo(cx - w / 2, cy - h / 2, cx + w / 2, cy - h / 2, r);
    ctx.closePath();
    ctx.fill();
    ctx.shadowColor = 'rgba(0,0,0,0.25)';
    ctx.shadowBlur = 6;
    ctx.shadowOffsetY = 3;
    ctx.fill();
    ctx.restore();

    ctx.fillStyle = '#000000';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = `700 ${Math.round(h * 0.42)}px -apple-system, sans-serif`;
    ctx.fillText('☕ Buy me a coffee', cx, cy + h * 0.03);
  }

  function draw(){
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const W = rect.width, H = rect.height;

    // background — same muted yellow as buymeacoffee.html
    ctx.fillStyle = '#B7A968';
    ctx.fillRect(0, 0, W, H);

    // evenly spaced coffee-cup pattern
    const spacing = W * 0.13;
    const iconSize = spacing * 0.16;
    for(let y = spacing / 2; y < H + spacing; y += spacing){
      for(let x = spacing / 2; x < W + spacing; x += spacing){
        drawCoffeeIcon(x, y, iconSize, 'rgba(74, 58, 20, 0.18)');
      }
    }

    // the button itself, dead center
    drawPillButton(W / 2, H / 2, W * 0.62, H * 0.16);
  }

  draw();
  window.addEventListener('resize', draw);
})();
</script>
</body>
</html>
